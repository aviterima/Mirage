<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap');
    body { margin: 0; }
    * { box-sizing: border-box; }
    a { color: #4F46E5; } a:hover { color: #4338CA; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F6F7F9; font-family: 'Manrope', system-ui, sans-serif; color: #1B1B1F;">

  <!-- APP BAR -->
  <div style="position: absolute; top: 0; left: 0; right: 0; padding: 56px 20px 14px; background: #fff; border-bottom: 1px solid #EEEFF3; display: flex; align-items: center; gap: 14px;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1B1B1F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    <div style="display: flex; flex-direction: column;">
      <span style="font-size: 19px; font-weight: 800; letter-spacing: -0.2px;">Weekday commute</span>
      <span style="font-size: 12.5px; font-weight: 600; color: #80858E;">4 steps · 09:00 – 18:10</span>
    </div>
  </div>

  <!-- CLOCK MODE CHIPS -->
  <div style="position: absolute; top: 118px; left: 16px; right: 16px; display: flex; gap: 8px;">
    <div style="flex: 1; text-align: center; background: #4F46E5; color: #fff; border-radius: 20px; padding: 9px 0; font-size: 13px; font-weight: 700;">Real-time</div>
    <div style="flex: 1; text-align: center; background: #fff; color: #5F6368; border: 1px solid #E1E4EA; border-radius: 20px; padding: 9px 0; font-size: 13px; font-weight: 600;">Compressed</div>
    <div style="flex: 1; text-align: center; background: #fff; color: #5F6368; border: 1px solid #E1E4EA; border-radius: 20px; padding: 9px 0; font-size: 13px; font-weight: 600;">Anchored</div>
  </div>

  <!-- TIMELINE -->
  <div style="position: absolute; top: 170px; left: 0; right: 0; bottom: 96px; overflow: hidden; padding: 8px 16px 0;">
    <div style="position: relative;">
      <!-- rail -->
      <div style="position: absolute; left: 23px; top: 14px; bottom: 8px; width: 2px; background: #E1E4EA;"></div>

      <!-- Step 1: Stay -->
      <div style="position: relative; padding-left: 52px; margin-bottom: 12px;">
        <div style="position: absolute; left: 15px; top: 20px; width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 3px solid #16A34A;"></div>
        <div style="background: #fff; border: 1px solid #EDEEF2; border-radius: 16px; padding: 13px 15px; display: flex; align-items: center; gap: 12px; box-shadow: 0 2px 6px rgba(20,20,40,0.05);">
          <div style="width: 38px; height: 38px; border-radius: 11px; background: #E6F4EA; display: flex; align-items: center; justify-content: center;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#128A3E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
          </div>
          <div style="flex: 1;">
            <span style="font-size: 11px; font-weight: 700; color: #128A3E; text-transform: uppercase; letter-spacing: 0.5px;">Stay</span>
            <div style="font-size: 15.5px; font-weight: 700;">Home</div>
          </div>
          <span style="font-size: 12.5px; font-weight: 700; color: #80858E;">until 08:30</span>
        </div>
      </div>

      <!-- Step 2: Travel -->
      <div style="position: relative; padding-left: 52px; margin-bottom: 12px;">
        <div style="position: absolute; left: 15px; top: 20px; width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 3px solid #4F46E5;"></div>
        <div style="background: #fff; border: 1px solid #EDEEF2; border-radius: 16px; padding: 13px 15px; display: flex; align-items: center; gap: 12px; box-shadow: 0 2px 6px rgba(20,20,40,0.05);">
          <div style="width: 38px; height: 38px; border-radius: 11px; background: #E7E5FB; display: flex; align-items: center; justify-content: center;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4F46E5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l1.5-4.5A2 2 0 0 1 8.4 7h7.2a2 2 0 0 1 1.9 1.5L19 13"/><path d="M4 13h16v4H4zM6 17v2M18 17v2"/></svg>
          </div>
          <div style="flex: 1;">
            <span style="font-size: 11px; font-weight: 700; color: #4F46E5; text-transform: uppercase; letter-spacing: 0.5px;">Travel</span>
            <div style="font-size: 15.5px; font-weight: 700;">to Office</div>
            <span style="font-size: 12.5px; font-weight: 600; color: #80858E;">25 min · Drive · 45 mph avg</span>
          </div>
        </div>
      </div>

      <!-- PLAY HEAD -->
      <div style="position: relative; padding-left: 52px; margin: 4px 0 14px; display: flex; align-items: center; gap: 10px;">
        <div style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; border-radius: 50%; background: #DC2626; border: 3px solid #fff; box-shadow: 0 0 0 3px rgba(220,38,38,0.18);"></div>
        <div style="flex: 1; height: 2px; background: #DC2626; opacity: 0.35; border-radius: 2px;"></div>
        <span style="font-size: 12px; font-weight: 800; color: #DC2626; letter-spacing: 0.3px;">NOW · 08:52</span>
      </div>

      <!-- Step 3: Stay -->
      <div style="position: relative; padding-left: 52px; margin-bottom: 12px;">
        <div style="position: absolute; left: 15px; top: 20px; width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 3px solid #16A34A;"></div>
        <div style="background: #fff; border: 1px solid #EDEEF2; border-radius: 16px; padding: 13px 15px; display: flex; align-items: center; gap: 12px; box-shadow: 0 2px 6px rgba(20,20,40,0.05);">
          <div style="width: 38px; height: 38px; border-radius: 11px; background: #E6F4EA; display: flex; align-items: center; justify-content: center;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#128A3E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          </div>
          <div style="flex: 1;">
            <span style="font-size: 11px; font-weight: 700; color: #128A3E; text-transform: uppercase; letter-spacing: 0.5px;">Stay</span>
            <div style="font-size: 15.5px; font-weight: 700;">Office</div>
          </div>
          <span style="font-size: 12.5px; font-weight: 700; color: #80858E;">09:00 – 12:30</span>
        </div>
      </div>

      <!-- Step 4: Travel -->
      <div style="position: relative; padding-left: 52px; margin-bottom: 12px;">
        <div style="position: absolute; left: 15px; top: 20px; width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 3px solid #4F46E5;"></div>
        <div style="background: #fff; border: 1px solid #EDEEF2; border-radius: 16px; padding: 13px 15px; display: flex; align-items: center; gap: 12px; box-shadow: 0 2px 6px rgba(20,20,40,0.05);">
          <div style="width: 38px; height: 38px; border-radius: 11px; background: #E7E5FB; display: flex; align-items: center; justify-content: center;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4F46E5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l1.5-4.5A2 2 0 0 1 8.4 7h7.2a2 2 0 0 1 1.9 1.5L19 13"/><path d="M4 13h16v4H4zM6 17v2M18 17v2"/></svg>
          </div>
          <div style="flex: 1;">
            <span style="font-size: 11px; font-weight: 700; color: #4F46E5; text-transform: uppercase; letter-spacing: 0.5px;">Travel</span>
            <div style="font-size: 15.5px; font-weight: 700;">to Gym</div>
            <span style="font-size: 12.5px; font-weight: 600; color: #80858E;">18 min · Drive</span>
          </div>
        </div>
      </div>

      <!-- Add step -->
      <div style="margin-left: 52px; display: flex; align-items: center; justify-content: center; gap: 8px; border: 1.5px dashed #C2C6CF; border-radius: 14px; padding: 12px; color: #5F6368; font-weight: 700; font-size: 14px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6368" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Add step
      </div>
    </div>
  </div>

  <!-- START DAY -->
  <div style="position: absolute; left: 16px; right: 16px; bottom: 24px; display: flex; align-items: center; justify-content: center; gap: 10px; background: #4F46E5; color: #fff; padding: 17px; border-radius: 18px; box-shadow: 0 8px 20px rgba(79,70,229,0.4); font-weight: 800; font-size: 16px;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="#fff" stroke="none"><path d="M8 5v14l11-7z"/></svg>
    Play day
  </div>

</div>
</x-dc>
</body>
</html>
