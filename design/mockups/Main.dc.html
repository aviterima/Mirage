<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap');
    body { margin: 0; }
    * { box-sizing: border-box; }
    a { color: #4F46E5; } a:hover { color: #4338CA; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #e9edf2; font-family: 'Manrope', system-ui, sans-serif; color: #1B1B1F;">

  <!-- MAP -->
  <svg viewBox="0 0 390 844" width="390" height="844" style="position: absolute; inset: 0;" preserveAspectRatio="xMidYMid slice">
    <rect width="390" height="844" fill="#e9edf2"/>
    <path d="M-20 90 Q 90 60 180 110 T 380 96 L 420 240 Q 250 285 120 245 T -20 270 Z" fill="#dbe9d4"/>
    <path d="M250 560 Q 330 535 430 600 L 430 780 Q 320 745 250 790 Z" fill="#cfe0ef"/>
    <g stroke="#ffffff" stroke-width="15" fill="none" stroke-linecap="round">
      <path d="M-10 300 L 420 342"/>
      <path d="M-10 610 L 420 566"/>
      <path d="M118 -10 L 150 870"/>
      <path d="M312 -10 L 336 870"/>
    </g>
    <g stroke="#ffffff" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.9">
      <path d="M-10 180 L 420 200"/>
      <path d="M-10 460 L 420 440"/>
      <path d="M-10 730 L 420 705"/>
      <path d="M220 -10 L 245 870"/>
      <path d="M40 -10 L 60 870"/>
    </g>
    <g fill="#dfe3ea">
      <rect x="20" y="330" width="72" height="96" rx="4"/>
      <rect x="168" y="352" width="118" height="80" rx="4"/>
      <rect x="30" y="480" width="70" height="88" rx="4"/>
      <rect x="176" y="470" width="60" height="70" rx="4"/>
    </g>
  </svg>

  <!-- center pin -->
  <div style="position: absolute; left: 195px; top: 402px; transform: translate(-50%, -100%);">
    <svg width="34" height="44" viewBox="0 0 34 44"><path d="M17 2C9 2 3 8 3 16c0 9.5 14 26 14 26s14-16.5 14-26C31 8 25 2 17 2z" fill="#4F46E5" stroke="#fff" stroke-width="2.5"/><circle cx="17" cy="16" r="5" fill="#fff"/></svg>
  </div>

  <!-- SEARCH BAR -->
  <div style="position: absolute; top: 52px; left: 16px; right: 16px; height: 54px; background: #fff; border-radius: 27px; box-shadow: 0 6px 20px rgba(20,20,40,0.12); display: flex; align-items: center; gap: 12px; padding: 0 16px;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5F6368" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
    <span style="flex: 1; color: #80858E; font-size: 15px; font-weight: 500;">Search a place, address, or landmark</span>
    <div style="width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg,#4F46E5,#7C74F0); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 13px;">M</div>
  </div>

  <!-- FAVORITE CHIPS -->
  <div style="position: absolute; top: 120px; left: 16px; right: 16px; display: flex; gap: 8px;">
    <div style="display: flex; align-items: center; gap: 7px; background: #fff; border: 1px solid #E1E4EA; border-radius: 20px; padding: 8px 14px; box-shadow: 0 2px 6px rgba(20,20,40,0.06);">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4F46E5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      <span style="font-size: 13.5px; font-weight: 600;">Home</span>
    </div>
    <div style="display: flex; align-items: center; gap: 7px; background: #fff; border: 1px solid #E1E4EA; border-radius: 20px; padding: 8px 14px; box-shadow: 0 2px 6px rgba(20,20,40,0.06);">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4F46E5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      <span style="font-size: 13.5px; font-weight: 600;">Work</span>
    </div>
    <div style="display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.75); border: 1px dashed #B9BDC7; border-radius: 20px; padding: 8px 13px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5F6368" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      <span style="font-size: 13.5px; font-weight: 600; color: #5F6368;">Add</span>
    </div>
  </div>

  <!-- JOYSTICK FAB -->
  <div style="position: absolute; right: 16px; bottom: 168px; width: 52px; height: 52px; border-radius: 16px; background: #fff; box-shadow: 0 6px 16px rgba(20,20,40,0.16); display: flex; align-items: center; justify-content: center;">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#4F46E5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3 4h-6zM12 22l3-4h-6zM2 12l4-3v6zM22 12l-4-3v6z"/><circle cx="12" cy="12" r="2.5"/></svg>
  </div>

  <!-- PRIMARY ACTION (extended FAB) -->
  <div style="position: absolute; left: 50%; transform: translateX(-50%); bottom: 96px; display: flex; align-items: center; gap: 10px; background: #4F46E5; color: #fff; padding: 16px 26px; border-radius: 20px; box-shadow: 0 10px 24px rgba(79,70,229,0.42); font-weight: 700; font-size: 16px; white-space: nowrap;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l18-8-8 18-2-8-8-2z"/></svg>
    Simulate route
  </div>

  <!-- BOTTOM NAV -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 78px; background: #fff; border-top: 1px solid #EAECF0; display: flex; justify-content: space-around; align-items: flex-start; padding-top: 12px;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #4F46E5;">
      <div style="background: #E7E5FB; border-radius: 16px; padding: 4px 18px;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4F46E5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg></div>
      <span style="font-size: 11px; font-weight: 700;">Map</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #6B7078;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B7078" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8 6h7a4 4 0 0 1 0 8H9a4 4 0 0 0 0 8"/></svg>
      <span style="font-size: 11px; font-weight: 600;">Routes</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #6B7078;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B7078" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/></svg>
      <span style="font-size: 11px; font-weight: 600;">Day</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #6B7078;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B7078" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg>
      <span style="font-size: 11px; font-weight: 600;">Library</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
