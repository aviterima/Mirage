<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap');
    body { margin: 0; }
    * { box-sizing: border-box; }
    a { color: #4F46E5; } a:hover { color: #4338CA; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #e9edf2; font-family: 'Manrope', system-ui, sans-serif; color: #1B1B1F;">

  <!-- MAP -->
  <svg viewBox="0 0 390 844" width="390" height="844" style="position: absolute; inset: 0;" preserveAspectRatio="xMidYMid slice">
    <rect width="390" height="844" fill="#e9edf2"/>
    <path d="M-20 120 Q 110 90 210 140 T 420 126 L 460 250 Q 260 295 130 255 T -20 280 Z" fill="#dbe9d4"/>
    <path d="M250 600 Q 330 575 430 640 L 430 820 Q 320 785 250 830 Z" fill="#cfe0ef"/>
    <g stroke="#ffffff" stroke-width="15" fill="none" stroke-linecap="round">
      <path d="M-10 330 L 420 372"/>
      <path d="M-10 640 L 420 596"/>
      <path d="M95 -10 L 128 870"/>
      <path d="M300 -10 L 326 870"/>
    </g>
    <g stroke="#ffffff" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.9">
      <path d="M-10 500 L 420 480"/>
      <path d="M215 -10 L 240 870"/>
    </g>
    <!-- route -->
    <path d="M120 250 C 170 360, 250 380, 250 470 S 190 600, 250 690" fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round"/>
    <path d="M120 250 C 170 360, 250 380, 250 470 S 190 600, 250 690" fill="none" stroke="#4F46E5" stroke-width="6" stroke-linecap="round"/>
    <!-- traveled portion -->
    <path d="M120 250 C 170 360, 250 380, 250 470" fill="none" stroke="#312BA6" stroke-width="6" stroke-linecap="round" stroke-dasharray="1 9"/>
    <!-- start -->
    <circle cx="120" cy="250" r="7" fill="#16A34A" stroke="#fff" stroke-width="3"/>
    <!-- end -->
    <g transform="translate(250,690)"><circle r="7" fill="#4F46E5" stroke="#fff" stroke-width="3"/></g>
  </svg>

  <!-- car marker -->
  <div style="position: absolute; left: 250px; top: 470px; transform: translate(-50%,-50%);">
    <div style="width: 40px; height: 40px; border-radius: 50%; background: #4F46E5; border: 4px solid #fff; box-shadow: 0 4px 14px rgba(79,70,229,0.5); display: flex; align-items: center; justify-content: center;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l1.5-4.5A2 2 0 0 1 8.4 7h7.2a2 2 0 0 1 1.9 1.5L19 13"/><path d="M4 13h16v4H4zM6 17v2M18 17v2"/></svg>
    </div>
  </div>

  <!-- TELEMETRY CARD -->
  <div style="position: absolute; top: 52px; left: 16px; right: 16px; background: #fff; border-radius: 22px; box-shadow: 0 8px 24px rgba(20,20,40,0.16); padding: 16px 18px; display: flex; flex-direction: column; gap: 14px;">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <div style="display: flex; align-items: baseline; gap: 6px;">
        <span style="font-size: 40px; font-weight: 800; letter-spacing: -1px; line-height: 1;">43</span>
        <span style="font-size: 15px; font-weight: 700; color: #80858E;">mph</span>
      </div>
      <div style="display: flex; align-items: center; gap: 7px; background: #E6F4EA; color: #128A3E; border-radius: 20px; padding: 8px 14px; font-weight: 700; font-size: 13.5px;">
        <span style="width: 9px; height: 9px; border-radius: 50%; background: #16A34A;"></span>
        Spoofing
      </div>
    </div>
    <div style="height: 1px; background: #EEEFF3;"></div>
    <div style="display: flex; justify-content: space-between;">
      <div style="display: flex; flex-direction: column; gap: 3px;">
        <span style="font-size: 11px; font-weight: 700; color: #9096A0; text-transform: uppercase; letter-spacing: 0.4px;">Coordinates</span>
        <span style="font-size: 13.5px; font-weight: 700;">37.7929, −122.396</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 3px; align-items: center;">
        <span style="font-size: 11px; font-weight: 700; color: #9096A0; text-transform: uppercase; letter-spacing: 0.4px;">Bearing</span>
        <span style="font-size: 13.5px; font-weight: 700;">148° SE</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 3px; align-items: flex-end;">
        <span style="font-size: 11px; font-weight: 700; color: #9096A0; text-transform: uppercase; letter-spacing: 0.4px;">ETA</span>
        <span style="font-size: 13.5px; font-weight: 700;">12 min</span>
      </div>
    </div>
  </div>

  <!-- BOTTOM CONTROLS -->
  <div style="position: absolute; left: 16px; right: 16px; bottom: 28px; display: flex; flex-direction: column; gap: 16px;">
    <!-- scrubber -->
    <div style="background: #fff; border-radius: 18px; box-shadow: 0 6px 18px rgba(20,20,40,0.14); padding: 14px 16px; display: flex; flex-direction: column; gap: 9px;">
      <div style="position: relative; height: 20px; display: flex; align-items: center;">
        <div style="position: absolute; left: 0; right: 0; height: 6px; border-radius: 3px; background: #E7E8EE;"></div>
        <div style="position: absolute; left: 0; width: 46%; height: 6px; border-radius: 3px; background: #4F46E5;"></div>
        <div style="position: absolute; left: 46%; transform: translateX(-50%); width: 20px; height: 20px; border-radius: 50%; background: #4F46E5; border: 3px solid #fff; box-shadow: 0 2px 6px rgba(79,70,229,0.5);"></div>
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: #80858E;">
        <span>8:24 min</span>
        <span>4.6 / 9.8 mi</span>
        <span>−12:00</span>
      </div>
    </div>
    <!-- STOP -->
    <div style="display: flex; align-items: center; justify-content: center; gap: 10px; background: #DC2626; color: #fff; padding: 17px; border-radius: 18px; box-shadow: 0 8px 20px rgba(220,38,38,0.4); font-weight: 800; font-size: 16.5px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><rect x="5" y="5" width="14" height="14" rx="3"/></svg>
      Stop simulation
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
