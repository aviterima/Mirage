name: Android build

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
      MIRAGE_API_BASE: ${{ vars.MIRAGE_API_BASE }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Provision once in repository Actions secrets; never generate a key in CI.
      - name: Restore permanent APK signing key
        env:
          MIRAGE_DEBUG_KEYSTORE_BASE64: ${{ secrets.MIRAGE_DEBUG_KEYSTORE_BASE64 }}
          MIRAGE_SIGNING_CERT_SHA256: ${{ vars.MIRAGE_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if [ -z "$MIRAGE_DEBUG_KEYSTORE_BASE64" ] || [ -z "$MIRAGE_SIGNING_CERT_SHA256" ]; then
            echo "::error::Permanent signing is not configured. Set MIRAGE_DEBUG_KEYSTORE_BASE64 and MIRAGE_SIGNING_CERT_SHA256 before distributing another APK."
            exit 1
          fi
          umask 077
          mkdir -p "$HOME/.android"
          printf '%s' "$MIRAGE_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          actual_cert=$(keytool -exportcert -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android | sha256sum | cut -d ' ' -f 1)
          expected_cert=$(printf '%s' "$MIRAGE_SIGNING_CERT_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          if [ "$actual_cert" != "$expected_cert" ]; then
            echo "::error::Signing certificate does not match the pinned identity. Refusing to build."
            exit 1
          fi

      - name: Build debug APK
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          # Flip to hosted keys later by setting this repository VARIABLE (Settings →
          # Secrets and variables → Actions → Variables) to the Cloud Run URL. Empty = direct keys.
          MIRAGE_API_BASE: ${{ vars.MIRAGE_API_BASE }}
        run: ./gradlew --no-daemon assembleDebug

      - name: Unit tests (blocking — a red test never ships)
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: android/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Lint (non-blocking)
        continue-on-error: true
        run: ./gradlew --no-daemon lintDebug

      - name: Verify offline voice model is packaged
        run: unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'assets/model-en-us/am/final.mdl'

      - name: Verify APK signing identity before distribution
        env:
          MIRAGE_SIGNING_CERT_SHA256: ${{ vars.MIRAGE_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          apksigner_path=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$apksigner_path"
          "$apksigner_path" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk | tee "$RUNNER_TEMP/mirage-cert.txt"
          actual_cert=$(sed -n 's/.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/mirage-cert.txt" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          expected_cert=$(printf '%s' "$MIRAGE_SIGNING_CERT_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          test -n "$actual_cert"
          if [ "$actual_cert" != "$expected_cert" ]; then
            echo "::error::APK certificate $actual_cert does not match pinned certificate $expected_cert"
            cat "$RUNNER_TEMP/mirage-cert.txt"
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mirage-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Small transport artifacts allow clients with a 32 MiB transfer cap to retrieve
      # the signed APK unchanged. The complete APK artifact remains available above.
      - name: Prepare test-build download parts
        if: startsWith(github.ref, 'refs/heads/codex/acceptance-')
        run: |
          mkdir -p "$RUNNER_TEMP/apk-parts"
          split -b 24M -d app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/apk-parts/app-debug.apk.part-"
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload test-build part 0
        if: startsWith(github.ref, 'refs/heads/codex/acceptance-')
        uses: actions/upload-artifact@v4
        with:
          name: mirage-apk-part-00
          path: ${{ runner.temp }}/apk-parts/app-debug.apk.part-00
          if-no-files-found: ignore

      - name: Upload test-build part 1
        if: startsWith(github.ref, 'refs/heads/codex/acceptance-')
        uses: actions/upload-artifact@v4
        with:
          name: mirage-apk-part-01
          path: ${{ runner.temp }}/apk-parts/app-debug.apk.part-01
          if-no-files-found: ignore

      - name: Upload test-build part 2
        if: startsWith(github.ref, 'refs/heads/codex/acceptance-')
        uses: actions/upload-artifact@v4
        with:
          name: mirage-apk-part-02
          path: ${{ runner.temp }}/apk-parts/app-debug.apk.part-02
          if-no-files-found: ignore

      - name: Upload test-build part 3
        if: startsWith(github.ref, 'refs/heads/codex/acceptance-')
        uses: actions/upload-artifact@v4
        with:
          name: mirage-apk-part-03
          path: ${{ runner.temp }}/apk-parts/app-debug.apk.part-03
          if-no-files-found: ignore

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Publish rolling APK release (direct download)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Mirage — latest debug APK
          prerelease: true
          files: android/app/build/outputs/apk/debug/*.apk
