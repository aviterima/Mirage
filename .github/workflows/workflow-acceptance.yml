name: Mirage workflow acceptance
on:
  push:
    branches: ["codex/acceptance-50-20260925", "codex/acceptance-continuation-0.11.3", "codex/continuation-release-0.11.3", "codex/live-itinerary-voice-0.12.0"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
      MIRAGE_API_BASE: ${{ vars.MIRAGE_API_BASE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore existing pinned signing identity
        env:
          MIRAGE_DEBUG_KEYSTORE_BASE64: ${{ secrets.MIRAGE_DEBUG_KEYSTORE_BASE64 }}
          MIRAGE_SIGNING_CERT_SHA256: ${{ vars.MIRAGE_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$MIRAGE_DEBUG_KEYSTORE_BASE64"
          test -n "$MIRAGE_SIGNING_CERT_SHA256"
          umask 077
          mkdir -p "$HOME/.android"
          printf '%s' "$MIRAGE_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          actual_cert=$(keytool -exportcert -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android | sha256sum | cut -d ' ' -f 1)
          expected_cert=$(printf '%s' "$MIRAGE_SIGNING_CERT_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          test "$actual_cert" = "$expected_cert"
      - name: Compile emulator tests
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest testDebugUnitTest
      - name: Download installed-version baseline for in-place upgrade check
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: aviterima/Mirage
          run-id: 36606555698
          pattern: mirage-tested-apk-part-*
          merge-multiple: true
          path: upgrade-baseline
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run actual Activity acceptance journeys
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          ram-size: 4096M
          heap-size: 512M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -cores 4
          disable-animations: true
          script: bash .github/scripts/check-upgrade.sh && bash .github/scripts/prepare-language-model.sh && bash .github/scripts/run-workflow-acceptance.sh
      - name: Print structured test results
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          for p in pathlib.Path('android/app/build/outputs/androidTest-results').rglob('*.xml'):
              try:
                  root = ET.parse(p).getroot()
              except ET.ParseError:
                  continue
              for case in root.iter('testcase'):
                  problem = case.find('failure')
                  if problem is None:
                      problem = case.find('error')
                  print(('FAIL' if problem is not None else 'PASS'), case.get('classname'), case.get('name'))
                  if problem is not None:
                      print((problem.text or problem.get('message', ''))[:3000])
          PY
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-acceptance-evidence
          path: |
            acceptance-evidence/
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
          if-no-files-found: warn

      - name: Package the tested APK unchanged
        if: success()
        run: |
          mkdir -p tested-parts
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk | tee tested-parts/SHA256.txt
          split -b 24M -d android/app/build/outputs/apk/debug/app-debug.apk tested-parts/Mirage-0.12.0.apk.part-
      - name: Upload tested APK part 0
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mirage-tested-apk-part-00
          path: tested-parts/Mirage-0.12.0.apk.part-00
          if-no-files-found: warn
      - name: Upload tested APK part 1
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mirage-tested-apk-part-01
          path: tested-parts/Mirage-0.12.0.apk.part-01
          if-no-files-found: warn
      - name: Upload tested APK part 2
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mirage-tested-apk-part-02
          path: tested-parts/Mirage-0.12.0.apk.part-02
          if-no-files-found: warn
      - name: Upload tested APK part 3
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mirage-tested-apk-part-03
          path: tested-parts/Mirage-0.12.0.apk.part-03
          if-no-files-found: warn
      - name: Upload tested APK part 4
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mirage-tested-apk-part-04
          path: tested-parts/Mirage-0.12.0.apk.part-04
          if-no-files-found: warn
      - name: Upload APK identity and unit tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: continuation-unit-and-identity
          path: |
            tested-parts/SHA256.txt
            android/app/build/reports/tests/testDebugUnitTest/
            android/app/build/test-results/testDebugUnitTest/
            acceptance-evidence/upgrade.txt

      - name: Upload tested APK part 5
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mirage-tested-apk-part-05
          path: tested-parts/Mirage-0.12.0.apk.part-05
          if-no-files-found: ignore

      - name: Upload tested APK part 6
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mirage-tested-apk-part-06
          path: tested-parts/Mirage-0.12.0.apk.part-06
          if-no-files-found: ignore

      - name: Upload tested APK part 7
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mirage-tested-apk-part-07
          path: tested-parts/Mirage-0.12.0.apk.part-07
          if-no-files-found: ignore
