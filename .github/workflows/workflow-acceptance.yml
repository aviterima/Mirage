name: Mirage workflow acceptance
on:
  push:
    branches: ["codex/acceptance-50-20260925"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore existing pinned signing identity
        env:
          MIRAGE_DEBUG_KEYSTORE_BASE64: ${{ secrets.MIRAGE_DEBUG_KEYSTORE_BASE64 }}
          MIRAGE_SIGNING_CERT_SHA256: ${{ vars.MIRAGE_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$MIRAGE_DEBUG_KEYSTORE_BASE64"
          test -n "$MIRAGE_SIGNING_CERT_SHA256"
          umask 077
          mkdir -p "$HOME/.android"
          printf '%s' "$MIRAGE_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          actual_cert=$(keytool -exportcert -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android | sha256sum | cut -d ' ' -f 1)
          expected_cert=$(printf '%s' "$MIRAGE_SIGNING_CERT_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          test "$actual_cert" = "$expected_cert"
      - name: Compile emulator tests
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run actual Activity acceptance journeys
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          script: |
            mkdir -p acceptance-evidence
            cd android
            set +e
            ./gradlew --no-daemon connectedDebugAndroidTest
            test_result=$?
            adb pull /sdcard/Android/data/com.mirage.app/files/acceptance ../acceptance-evidence/
            adb logcat -d -s AndroidRuntime TestRunner > ../acceptance-evidence/logcat.txt
            exit "$test_result"
      - name: Print structured test results
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          for p in pathlib.Path('android/app/build/outputs/androidTest-results').rglob('*.xml'):
              try:
                  root = ET.parse(p).getroot()
              except ET.ParseError:
                  continue
              for case in root.iter('testcase'):
                  problem = case.find('failure')
                  if problem is None:
                      problem = case.find('error')
                  print(('FAIL' if problem is not None else 'PASS'), case.get('classname'), case.get('name'))
                  if problem is not None:
                      print((problem.text or problem.get('message', ''))[:3000])
          PY
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-acceptance-evidence
          path: |
            acceptance-evidence/
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
          if-no-files-found: warn
