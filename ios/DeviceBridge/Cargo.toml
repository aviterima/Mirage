[package]
name = "mirage-device-bridge"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
idevice = { git = "https://github.com/jkcoxson/idevice", rev = "26a28f6a46b5d85a28043c2e62febfa394c8b0a6", default-features = false, features = ["ring", "tcp", "remote_pairing", "tunnel_tcp_stack", "rsd", "dvt", "location_simulation"] }
tokio = { version = "1", features = ["rt", "net", "sync", "time", "macros"] }
zeroize = "1.8"
sha2 = "0.10"
plist = "1.8"
ed25519-dalek = "2"
# Upstream Remote Pairing logs parsed credentials at debug level. Disable all
# tracing macros in every dependency in both debug and release configurations.
tracing = { version = "0.1", features = ["max_level_off", "release_max_level_off"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
